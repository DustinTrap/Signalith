id: endpoint-service-created
title: Service created with sc.exe on $dest$
description: sc.exe created a Windows service, which attackers use for persistence and lateral movement.
query: |
  datamodel=Endpoint process_name=sc.exe process="* create *"
schedule: 5m
lookback: 10m
severity: medium
mitre: [T1543.003]
throttle:
  fields: [dest, process]
  window: 24h
risk:
  score: 25
  objects:
    - {field: user, type: user}
    - {field: dest, type: system}
  only: true
enabled: true
tags: [persistence, windows]
