id: endpoint-credential-dumping
title: Credential dumping tool on $dest$
description: A command line references LSASS dumping or Mimikatz modules.
query: |
  datamodel=Endpoint
  process IN ("*sekurlsa*", "*lsadump*", "*kerberos::*", "*comsvcs*minidump*", "*procdump*lsass*")
  OR process_name IN (mimikatz.exe, pypykatz.exe)
schedule: 5m
lookback: 10m
severity: critical
mitre: [T1003.001]
throttle:
  fields: [dest, process]
  window: 4h
enabled: true
tags: [credential-access, windows]
