id: auth-brute-force
title: Brute force against $dest$ from $src$
description: One source failed to log on to a system many times within the lookback window.
query: |
  datamodel=Authentication action=failure
  | stats count, dc(user) as users by src, dest
  | where count >= 10
  | sort -count
schedule: 5m
lookback: 15m
severity: medium
mitre: [T1110]
throttle:
  fields: [src, dest]
  window: 1h
risk:
  score: 30
  objects:
    - {field: src, type: system}
enabled: true
tags: [authentication]
guidance: Check whether the source is internal, whether any attempt succeeded (see the successful brute force detection), and block the source if it is external.
