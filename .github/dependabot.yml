# Weekly pull requests for updates to Go modules, the GitHub Actions CI
# uses (pinned by commit), and the Docker images (pinned by digest).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy/docker
    schedule:
      interval: weekly
