# Quick start for evaluation on one machine (Linux, or Windows with Docker
# Desktop). OpenSearch security is disabled here for simplicity; enable it
# before exposing this beyond your workstation.
#
#   docker compose -f deploy/docker/docker-compose.yml up -d
#   open http://localhost:8080  (user admin, password from SIGNALITH_ADMIN_PASSWORD below)
#   point syslog senders at this machine on UDP or TCP port 514
#
# To update: git pull, then run the same command; it rebuilds Signalith.
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30

  signalith:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    # Rebuild from the checked-out code on every `up`, so after `git pull` the
    # same command runs the new version instead of the last image built.
    pull_policy: build
    depends_on:
      opensearch: { condition: service_healthy }
    ports:
      - "8080:8080"
      # Syslog: devices send to this machine on port 514, which reaches the
      # container's 5514 (it cannot open ports below 1024). If another syslog
      # server already uses 514 here, change the left side, e.g. "1514:5514/udp".
      - "514:5514/udp"
      - "514:5514/tcp"
    environment:
      - SIGNALITH_LISTEN=0.0.0.0:8080
      - SIGNALITH_OPENSEARCH_URL=http://opensearch:9200
      - SIGNALITH_ADMIN_PASSWORD=change-me-please
      - SIGNALITH_INGEST_TOKEN=change-this-ingest-token
    volumes:
      - ./signalith.yaml:/etc/signalith/signalith.yaml:ro
      - signalith-data:/var/lib/signalith

volumes:
  opensearch-data:
  signalith-data:
