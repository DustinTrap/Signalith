# Quick start for evaluation on one machine (Linux, or Windows with Docker
# Desktop). OpenSearch security is disabled here for simplicity; enable it
# before exposing this beyond your workstation.
#
#   docker compose -f deploy/docker/docker-compose.yml up -d
#   open http://localhost:8080  (user admin, password from SIGNALITH_ADMIN_PASSWORD below)
services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30

  signalith:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      opensearch: { condition: service_healthy }
    ports:
      - "8080:8080"
    environment:
      - SIGNALITH_LISTEN=0.0.0.0:8080
      - SIGNALITH_OPENSEARCH_URL=http://opensearch:9200
      - SIGNALITH_ADMIN_PASSWORD=change-me-please
      - SIGNALITH_INGEST_TOKEN=change-this-ingest-token
    volumes:
      - ./signalith.yaml:/etc/signalith/signalith.yaml:ro

volumes:
  opensearch-data:
