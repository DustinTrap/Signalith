# Settings for the Docker quick start. Secrets come from environment
# variables in docker-compose.yml.
server:
  listen: 0.0.0.0:8080
  public_url: http://localhost:8080
opensearch:
  url: http://opensearch:9200
  index_prefix: signalith
  replicas: 0
search:
  default_earliest: -24h
  max_events: 10000
retention:
  days: 90
auth:
  admin_user: admin
detections:
  dir: /var/lib/signalith/detections
  scheduler: true
  max_findings_per_run: 100
lookups:
  dir: /var/lib/signalith/lookups
dashboards:
  dir: /var/lib/signalith/dashboards
  stale_after: 2h
# Syslog from firewalls, switches and servers without an agent. The
# container cannot open ports below 1024, so it listens on 5514 and
# docker-compose.yml publishes it as port 514 on the host.
syslog:
  udp: 0.0.0.0:5514
  tcp: 0.0.0.0:5514
  allow: []
